name: Watcher Schema NF-e

on:
  schedule:
    # Roda todos os dias às 10:00 UTC (07:00 Horário de Brasília)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Forcar envio mesmo sem mudancas'
        required: false
        default: 'false'

# Evita que dois jobs tentem dar push ao mesmo tempo
concurrency:
  group: nfe-watcher-group
  cancel-in-progress: false

jobs:
  watch:
    name: Verificar schema NF-e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Busca todo o histórico para facilitar o rebase se necessário
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Atualizado para 2026 conforme o log sugeriu

      - name: Instalar
        run: npm install

      - name: Buscar HTML da SEFAZ via curl
        run: |
          mkdir -p data
          # curl lida nativamente com cookies ASP.NET (Set-Cookie no redirect)
          # -c grava cookies recebidos, -b reenvia na próxima requisição
          curl -s -L \
            -c /tmp/sefaz-cookies.txt \
            -b /tmp/sefaz-cookies.txt \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: text/html,application/xhtml+xml,*/*;q=0.8" \
            -H "Accept-Language: pt-BR,pt;q=0.9" \
            --retry 3 --retry-delay 5 \
            "https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=04BIflQt1aY=" \
            -o data/nt-page.html
          echo "NT page size: $(wc -c < data/nt-page.html) bytes"
          grep -c "exibirArquivo" data/nt-page.html && echo "Links encontrados" || echo "Nenhum link encontrado"

          curl -s -L \
            -c /tmp/sefaz-cookies.txt \
            -b /tmp/sefaz-cookies.txt \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: text/html,application/xhtml+xml,*/*;q=0.8" \
            -H "Accept-Language: pt-BR,pt;q=0.9" \
            --retry 3 --retry-delay 5 \
            "https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=BMPFMBoln3w=" \
            -o data/xsd-page.html
          echo "XSD page size: $(wc -c < data/xsd-page.html) bytes"
    
      - name: Debug HTML
        run: |
          echo "=== Tamanho dos arquivos ==="
          wc -c data/nt-page.html data/xsd-page.html
          echo "=== Links exibirArquivo no NT ==="
          grep -i "exibirArquivo" data/nt-page.html | head -10 || echo "NENHUM LINK ENCONTRADO"
          echo "=== Primeiros 500 chars do NT ==="
          head -c 500 data/nt-page.html
          

      - name: Executar
        id: watch
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FORCE_REPORT: ${{ github.event.inputs.force_report || 'false' }}
          NT_HTML_FILE: data/nt-page.html
          XSD_HTML_FILE: data/xsd-page.html
        run: npx tsx scripts/watch-schema.ts

      - name: Commit e Push Automático
        # Só roda se o seu script marcou que houve mudança
        if: steps.watch.outputs.schema_changed == 'true'
        run: |
          git config user.name "schema-watcher-bot"
          git config user.email "bot@noreply.github.com"
          git add data/
          
          # Só commita se houver de fato algo no 'git add'
          git commit -m "chore: snapshot atualizado [skip ci]" || exit 0
          
          # Estratégia de guerra contra o erro de [rejected]
          # Tenta puxar as mudanças remotas e colocar as suas em cima
          git pull --rebase origin main
          git push origin main
