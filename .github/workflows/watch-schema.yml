name: Watcher Schema NF-e

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Forcar envio mesmo sem mudancas'
        required: false
        default: 'false'

jobs:
  watch:
    name: Verificar schema NF-e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar
        run: npm install

      - name: Executar
        id: watch
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FORCE_REPORT: ${{ github.event.inputs.force_report || 'false' }}
        run: npx tsx scripts/watch-schema.ts

      - name: Commit snapshot
        if: steps.watch.outputs.schema_changed == 'true'
        run: |
          git config user.name "schema-watcher-bot"
          git config user.email "bot@noreply.github.com"
          git add data/
          git commit -m "chore: snapshot atualizado"
          git push